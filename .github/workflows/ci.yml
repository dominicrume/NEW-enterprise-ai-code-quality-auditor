name: CI
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with dashboard extras + bandit)
        run: pip install -e ".[dashboard]" bandit python-dotenv pynput
      - name: Lint (ruff if configured, else skip)
        run: pip install ruff && ruff check . || true
      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=dominicrume_NEW-enterprise-ai-code-quality-auditor
            -Dsonar.organization=dominicrume
