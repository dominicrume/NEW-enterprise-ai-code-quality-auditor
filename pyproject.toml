[project]
name = "ai-code-quality-auditor"
version = "0.1.0"
description = "Empirical Safety Harness for agentic AI coding systems."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
  "radon>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "jupyter>=1.0"]
dashboard = ["flask>=3.0"]

[project.scripts]
auditor = "auditor.core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
